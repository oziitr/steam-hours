# Plesk additional nginx directives for a dedicated subdomain.
# Generate /etc/nginx/steam-hours.htpasswd separately. Never put passwords in Git.
auth_basic "Private access";
auth_basic_user_file /etc/nginx/steam-hours.htpasswd;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
location = /robots.txt {
    auth_basic off;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}
location ~ ^/ {
    proxy_pass http://127.0.0.1:3480;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_read_timeout 60s;
    client_max_body_size 8k;
}
